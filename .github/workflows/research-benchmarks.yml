name: Research benchmark reproducibility

on:
  push:
    paths:
      - 'benchmarks/**'
      - '.github/workflows/research-benchmarks.yml'
  pull_request:
    paths:
      - 'benchmarks/**'
      - '.github/workflows/research-benchmarks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-research-evidence:
    name: Verify synthetic CPU benchmark evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Display environment
        run: |
          python3 --version
          gcc --version | head -1
      - name: Run correctness tests
        run: python3 -m unittest discover -s benchmarks -p 'test_bench_research.py' -v
      - name: Validate immutable evidence
        run: |
          python3 benchmarks/check_multiseed.py
          python3 benchmarks/check_rerank.py
          python3 benchmarks/check_rerank_stress.py
          python3 benchmarks/check_rerank_direct.py
          python3 benchmarks/check_rerank_scale.py
          python3 benchmarks/check_holdout.py
          python3 benchmarks/check_policy_v2.py
          python3 benchmarks/check_margin_policy.py
          python3 benchmarks/check_margin_comparison.py
          python3 benchmarks/check_quant_scales.py
          python3 benchmarks/check_quant_peers.py
          python3 benchmarks/check_float_storage.py
          python3 benchmarks/check_coalesced_reads.py
          python3 benchmarks/check_concurrent_reads.py
          python3 benchmarks/check_shared_server.py
          python3 benchmarks/check_shared_overload.py
          python3 benchmarks/summarize_results.py --directory benchmarks/results --date 2026-10-29 > /dev/null
      - name: Compile CPU benchmarks
        run: |
          for name in bench_vector bench_rerank bench_rerank_stress bench_rerank_direct bench_score_margin bench_quant_scales bench_float_storage bench_coalesced_reads bench_concurrent_reads; do
            gcc -O3 -Wall -Wextra -std=c11 "benchmarks/${name}.c" -lm -o "/tmp/${name}"
          done
          gcc -O3 -Wall -Wextra -std=c11 -pthread benchmarks/bench_shared_server.c -lm -o /tmp/bench_shared_server
      - name: Small synthetic CPU smoke tests
        run: |
          /tmp/bench_vector 256 48 3 1 20261029 | python3 -c 'import json,sys; x=json.load(sys.stdin); assert x["status"]=="PASS" and x["sanity_failures"]==0'
          /tmp/bench_rerank 256 48 3 1 20261029 | python3 -c 'import json,sys; x=json.load(sys.stdin); assert x["status"]=="PASS" and x["sanity_failures"]==0'
          /tmp/bench_rerank_stress 256 48 3 1 20261029 clustered | python3 -c 'import json,sys; x=json.load(sys.stdin); assert x["status"]=="PASS" and x["sanity_failures"]==0'
          /tmp/bench_rerank_direct 256 48 3 1 20261029 temporal | python3 -c 'import json,sys; x=json.load(sys.stdin); assert x["status"]=="PASS" and x["sanity_failures"]==0'
          /tmp/bench_score_margin 256 48 3 1 20261029 clustered 0.0064 | python3 -c 'import json,sys; x=json.load(sys.stdin); assert x["status"]=="PASS" and x["sanity_failures"]==0 and len(x["query_details"])==3'
          /tmp/bench_quant_scales 256 48 3 1 20261029 clustered | python3 -c 'import json,sys; x=json.load(sys.stdin); assert x["status"]=="PASS" and x["sanity_failures"]==0 and [s["name"] for s in x["schemes"]]==["fixed127","per_vector_absmax"]'
          /tmp/bench_float_storage 256 48 3 1 20261140 clustered ram 20 | python3 -c 'import json,sys; x=json.load(sys.stdin); assert x["status"]=="PASS" and x["sanity_failures"]==0 and x["mode"]=="ram"'
          /tmp/bench_float_storage 256 48 3 1 20261140 clustered pread_warm 20 | python3 -c 'import json,sys; x=json.load(sys.stdin); assert x["status"]=="PASS" and x["sanity_failures"]==0 and x["read_calls"]==60 and x["backing_file_size_bytes"]==256*48*4'
          /tmp/bench_coalesced_reads 256 48 3 1 20261150 temporal pread_sorted_warm 20 | python3 -c 'import json,sys; x=json.load(sys.stdin); assert x["status"]=="PASS" and x["sanity_failures"]==0 and x["read_calls"]==60 and x["hits"]<=15'
          /tmp/bench_coalesced_reads 256 48 3 1 20261150 temporal pread_coalesced_warm 20 | python3 -c 'import json,sys; x=json.load(sys.stdin); assert x["status"]=="PASS" and x["sanity_failures"]==0 and x["read_calls"]+x["adjacent_pairs"]==60'
          /tmp/bench_concurrent_reads 256 48 3 1 20261160 temporal pread_coalesced_warm 20 | python3 -c 'import json,sys; rows=sys.stdin.read().splitlines(); x=json.loads(rows[0]); q=json.loads(rows[1].removeprefix("QUERY_TIMINGS_US ")); assert x["status"]=="PASS" and x["sanity_failures"]==0 and len(q)==3 and x["total_query_count"]==3'
          python3 -c 'import sys; from pathlib import Path; sys.path.insert(0,"benchmarks"); import run_concurrent_reads as m; m.N=256; m.DIM=48; m.NQ=3; m.REPEATS=1; m.M=20; r=m.run_group(Path("/tmp/bench_concurrent_reads"),"temporal","pread_coalesced_warm",2,20261160); assert r["query_count"]==6 and r["recall_at5"]==1 and r["total_read_calls"]+r["total_adjacent_pairs"]==120'
          python3 -c 'import sys; from pathlib import Path; sys.path.insert(0,"benchmarks"); import run_shared_server as m; m.N=256; m.D=48; m.NQ=3; m.M=160; r=m.run_group(Path("/tmp/bench_shared_server"),"coalesced","temporal",2,4,20261170,queries=2,queue=8); assert r["accepted"]==8 and r["rejected"]==0 and r["recall_at5"]==1'
